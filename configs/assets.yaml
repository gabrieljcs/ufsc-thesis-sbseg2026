assets:
  strongreject:
    kind: strongreject
    group: datasets
    groups: [datasets, jailbreaks]
    source: github
    output: data/raw/strongreject/prompts.jsonl
    pilot_output: data/raw/strongreject/pilot_prompts.jsonl
    pilot_size: 2
    required_files: [data/raw/strongreject/prompts.jsonl, data/raw/strongreject/pilot_prompts.jsonl]
    required_columns: [prompt_id, text, harmful_goal, expected_output_form, fixed_constraints, allowed_adaptation, benchmark]
    description: "Primary forbidden-prompt source. The prompt list is imported here; StrongREJECT response scoring is implemented in the evaluation module."
  multijail:
    kind: hf_dataset
    group: datasets
    groups: [datasets, jailbreaks]
    repo_id: walledai/MultiJail
    local_dir: assets/datasets/multijail
    required_files: [assets/datasets/multijail/README.md]
    description: "External multilingual validation benchmark."
  belebele:
    kind: hf_dataset
    group: datasets
    groups: [datasets, specialization]
    repo_id: facebook/belebele
    local_dir: assets/datasets/belebele
    required_files: [assets/datasets/belebele/README.md]
    description: "Benign multilingual reading-comprehension benchmark for IF/CONS/SPEC."
  nllb_200:
    kind: hf_model
    group: translation
    groups: [translation]
    repo_id: facebook/nllb-200-distilled-600M
    local_dir: assets/models/nllb-200-distilled-600M
    required_files: [assets/models/nllb-200-distilled-600M/config.json, assets/models/nllb-200-distilled-600M/tokenizer_config.json]
    required_any_files: [[assets/models/nllb-200-distilled-600M/pytorch_model.bin, assets/models/nllb-200-distilled-600M/pytorch_model.bin.index.json, assets/models/nllb-200-distilled-600M/model.safetensors, assets/models/nllb-200-distilled-600M/model.safetensors.index.json]]
    allow_patterns:
      - config.json
      - generation_config.json
      - tokenizer_config.json
      - special_tokens_map.json
      - tokenizer.json
      - sentencepiece.bpe.model
      - pytorch_model.bin
      - pytorch_model-*.bin
      - pytorch_model.bin.index.json
      - model.safetensors
      - model-*.safetensors
      - model.safetensors.index.json
    description: "NLLB-200 translator checkpoint for controlled prompt translation."
  nllb_200_1_3b:
    kind: hf_model
    group: translation
    groups: [translation]
    repo_id: facebook/nllb-200-1.3B
    local_dir: assets/models/nllb-200-1.3B
