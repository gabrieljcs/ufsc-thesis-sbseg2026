      - pytorch_model.bin.index.json
      - model.safetensors
      - model-*.safetensors
      - model.safetensors.index.json
    description: "Largest official NLLB-200 translator checkpoint. Use on the RTX machine if the 600M/1.3B translations are insufficient."
