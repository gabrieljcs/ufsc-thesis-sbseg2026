      - pytorch_model.bin.index.json
      - model.safetensors
      - model-*.safetensors
      - model.safetensors.index.json
    description: "Larger NLLB-200 1.3B translator checkpoint. Heavier but still smaller than the 3.3B model."
  nllb_200_3_3b:
