    required_any_files: [[assets/models/nllb-200-1.3B/pytorch_model.bin, assets/models/nllb-200-1.3B/pytorch_model.bin.index.json, assets/models/nllb-200-1.3B/model.safetensors, assets/models/nllb-200-1.3B/model.safetensors.index.json]]
    allow_patterns:
      - config.json
      - generation_config.json
      - tokenizer_config.json
